<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-xs space-y-6">
      <div class="flex items-center gap-4 pb-6 border-b border-slate-200">
        <div id="profile-avatar" class="w-16 h-16 rounded-2xl bg-emerald-100 text-[#0C831F] font-extrabold text-2xl flex items-center justify-center border border-emerald-200">
          U
        </div>
        <div>
          <h1 id="profile-name" class="text-xl sm:text-2xl font-extrabold text-slate-900 font-display">Customer Name</h1>
          <p id="profile-mobile" class="text-xs text-slate-500 font-mono mt-0.5 font-medium">9876543210</p>
        </div>
      </div>

      <div class="space-y-3 text-xs font-medium">
        <div class="flex items-center justify-between py-2 border-b border-slate-200">
          <span class="text-slate-500">Account Role:</span>
          <span class="font-extrabold text-slate-900">Registered Customer</span>
        </div>
        <div class="flex items-center justify-between py-2 border-b border-slate-200">
          <span class="text-slate-500">Email Address:</span>
          <span id="profile-email" class="font-bold text-slate-800">—</span>
        </div>
      </div>

      <div class="pt-4 flex flex-col sm:flex-row gap-3">
        <a href="./orders.html" class="btn-primary flex-1 text-xs sm:text-sm !py-2.5 font-extrabold">
          <span>View My Orders</span>
        </a>
        <button onclick="Auth.logoutCustomer()" class="btn-secondary text-xs sm:text-sm !py-2.5 text-rose-600 hover:text-rose-700 font-bold">
          <span>Logout</span>
        </button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireCustomer('login.html');
      UI.renderHeader('profile');
      UI.renderFooter();
      UI.setPageTitle('Customer Profile');

      const user = Auth.getCustomer();
      if (user) {
        document.getElementById('profile-name').textContent = user.name || 'Valued Customer';
        document.getElementById('profile-mobile').textContent = user.mobile || '';
        document.getElementById('profile-email').textContent = user.email || 'None added';
        document.getElementById('profile-avatar').textContent = (user.name ? user.name.charAt(0) : 'U').toUpperCase();
      }
    });
  </script>
</body>
</html>
