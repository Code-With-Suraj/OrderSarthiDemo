<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout & Pickup Slot — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
      <a href="./cart.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        <span>Back to Basket</span>
      </a>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 font-display mt-2">Complete Your Store Pickup Order</h1>
    </div>

    <form id="checkout-form" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <!-- Left Column: Details & Slot Selector -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Step 1: Customer Info -->
        <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
          <div class="flex items-center gap-2.5 pb-3 border-b border-slate-200">
            <span class="w-6 h-6 rounded-full bg-[#0C831F] text-white font-extrabold text-xs flex items-center justify-center">1</span>
            <h3 class="text-base font-extrabold text-slate-900 font-display">Customer Account & Pickup Contact</h3>
          </div>

          <div id="customer-account-badge"></div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">Your Full Name <span class="text-rose-600">*</span></label>
              <input type="text" id="customer-name" required placeholder="e.g. Rahul Sharma"
                class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-300 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] focus:ring-2 focus:ring-[#0C831F]/20 font-medium" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">Mobile Number <span class="text-rose-600">*</span></label>
              <input type="tel" id="customer-mobile" required placeholder="10-digit mobile" maxlength="10"
                class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-300 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] focus:ring-2 focus:ring-[#0C831F]/20 font-mono font-medium" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Optional Order Note</label>
            <input type="text" id="customer-note" placeholder="e.g. Please keep chilled dairy in separate bag"
              class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-300 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] font-medium" />
          </div>
        </div>

        <!-- Step 2: Pickup Date & Time Slot -->
        <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
          <div class="flex items-center gap-2.5 pb-3 border-b border-slate-200">
            <span class="w-6 h-6 rounded-full bg-[#0C831F] text-white font-extrabold text-xs flex items-center justify-center">2</span>
            <h3 class="text-base font-extrabold text-slate-900 font-display">Select Pickup Date & Time Slot</h3>
          </div>

          <!-- Date Selector Buttons -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">Pickup Date</label>
            <div id="date-selector-container" class="flex gap-2 sm:gap-3">
              <!-- Injected via JavaScript -->
            </div>
          </div>

          <!-- Time Slots Grid -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">Available Time Slots (30 Min Windows)</label>
            <div id="slots-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-64 overflow-y-auto pr-1">
              <!-- Injected via JavaScript -->
            </div>
          </div>
        </div>

        <!-- Step 3: Payment Option -->
        <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
          <div class="flex items-center justify-between pb-3 border-b border-slate-200">
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-6 rounded-full bg-[#0C831F] text-white font-extrabold text-xs flex items-center justify-center">3</span>
              <h3 class="text-base font-extrabold text-slate-900 font-display">Payment Method</h3>
            </div>
            <span id="payment-mode-tag" class="text-[11px] font-bold text-slate-500"></span>
          </div>

          <!-- Dynamic Payment Options Injected via JS -->
          <div id="payment-methods-container" class="space-y-3">
            <!-- Injected via checkout.js -->
          </div>
        </div>

      </div>

      <!-- Right Column: Order Review & Submit -->
      <div class="lg:col-span-5">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-5 sticky top-24 shadow-xs">
          <h3 class="text-base font-extrabold text-slate-900 font-display border-b border-slate-200 pb-3">Items Summary</h3>

          <div id="checkout-items-list" class="space-y-1 max-h-48 overflow-y-auto pr-1">
            <!-- Injected via JS -->
          </div>

          <div class="pt-3 border-t border-slate-200 space-y-2 text-xs font-medium">
            <div class="flex items-center justify-between text-slate-600">
              <span>Pickup Service:</span>
              <span class="text-[#0C831F] font-extrabold">FREE</span>
            </div>
            <div class="flex items-center justify-between font-extrabold text-sm text-slate-900 pt-2 border-t border-slate-200">
              <span id="checkout-total-label">Total Payable:</span>
              <span id="checkout-total-display" class="text-xl font-extrabold text-[#0C831F] font-display">₹0</span>
            </div>
          </div>

          <button type="submit" id="place-order-btn" class="btn-primary w-full text-sm font-extrabold !py-3.5 shadow-xs">
            <span id="place-order-btn-text">Confirm Order & Pickup Slot</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>

          <div class="text-[11px] text-slate-500 text-center flex items-center justify-center gap-1.5 font-medium">
            <svg class="w-4 h-4 text-[#0C831F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            <span>Safe & direct store pickup reservation</span>
          </div>
        </div>
      </div>
    </form>
  </main>

  <div id="site-footer"></div>

  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/checkout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CheckoutController.init();
    });
  </script>
</body>
</html>
