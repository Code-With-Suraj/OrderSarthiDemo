<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 max-w-md w-full shadow-xs space-y-6">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-extrabold text-slate-900 font-display">Create Account</h1>
        <p class="text-xs text-slate-500 font-medium">Sign up for instant 10-minute store pickup tracking</p>
      </div>

      <div id="checkout-notice" class="hidden p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 flex items-center gap-2.5 shadow-xs font-medium">
        <span class="text-base">🛍️</span>
        <span>Create an account to complete your Click & Collect pickup order.</span>
      </div>

      <form id="customer-register-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Full Name <span class="text-rose-600">*</span></label>
          <input type="text" id="reg-name" required placeholder="e.g. Rahul Sharma"
            class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] focus:ring-2 focus:ring-[#0C831F]/20 font-medium" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">10-Digit Mobile Number <span class="text-rose-600">*</span></label>
          <input type="tel" id="reg-mobile" required placeholder="10-digit Indian mobile" maxlength="10"
            class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] focus:ring-2 focus:ring-[#0C831F]/20 font-mono font-medium" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Email Address (Optional)</label>
          <input type="email" id="reg-email" placeholder="name@example.com"
            class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] font-medium" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Password <span class="text-rose-600">*</span></label>
          <input type="password" id="reg-password" required minlength="6" placeholder="Min. 6 characters"
            class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] focus:ring-2 focus:ring-[#0C831F]/20 font-medium" />
        </div>

        <button type="submit" id="reg-submit-btn" class="btn-primary w-full text-sm font-extrabold !py-3">
          <span>Create Account</span>
        </button>
      </form>

      <div class="text-center pt-2 border-t border-slate-200 text-xs text-slate-500 font-medium">
        Already registered? 
        <a id="login-link" href="./login.html" class="text-[#0C831F] hover:underline font-extrabold ml-1">Login here</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderHeader('register');
      UI.renderFooter();
      UI.setPageTitle('Create Account');

      const queryParams = Utils.getQueryParams();
      if (queryParams.redirect) {
        document.getElementById('checkout-notice')?.classList.remove('hidden');
        const loginLink = document.getElementById('login-link');
        if (loginLink) loginLink.href = `./login.html?redirect=${encodeURIComponent(queryParams.redirect)}`;
      }

      const form = document.getElementById('customer-register-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reg-submit-btn');
        btn.disabled = true;
        btn.textContent = 'Creating Account...';

        const name = document.getElementById('reg-name').value;
        const mobile = document.getElementById('reg-mobile').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        try {
          await Auth.registerCustomer(name, mobile, email, password);
          Utils.showToast('Account created successfully!', 'success');
          const redirect = queryParams.redirect ? decodeURIComponent(queryParams.redirect) : './shop.html';
          setTimeout(() => window.location.href = redirect, 500);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Create Account';
          Utils.showToast(err.message || 'Registration failed', 'error');
        }
      });
    });
  </script>
</body>
</html>
