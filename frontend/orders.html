<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 font-display">My Pickup Orders</h1>
      <p class="text-xs sm:text-sm text-slate-500 font-medium">View and track all your current and past 10-minute store pickup orders</p>
    </div>

    <!-- Orders List Container -->
    <div id="orders-list-container" class="space-y-4">
      <div class="bg-white border border-slate-200 rounded-3xl p-6 h-32 skeleton shadow-xs"></div>
      <div class="bg-white border border-slate-200 rounded-3xl p-6 h-32 skeleton shadow-xs"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/orders.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OrdersController.initOrdersPage();
    });
  </script>
</body>
</html>
