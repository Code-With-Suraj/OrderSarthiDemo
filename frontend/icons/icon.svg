<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Main Shopping Bag Icon -->
  <g filter="url(#glow)" transform="translate(106, 96)">
    <!-- Bag Handle -->
    <path d="M75 140 C75 60, 225 60, 225 140" fill="none" stroke="url(#bagGrad)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <path d="M20 130 L280 130 L260 320 C258 335, 245 345, 230 345 L70 345 C55 345, 42 335, 40 320 Z" fill="url(#bagGrad)" />

    <!-- Lightning Bolt (Fast Delivery / Instant Pickup) -->
    <path d="M165 170 L115 250 L145 250 L135 315 L185 235 L155 235 Z" fill="url(#boltGrad)"/>
  </g>
</svg>
