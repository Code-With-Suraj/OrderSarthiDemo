<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <link rel="apple-touch-icon" href="./icons/favicon.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="shortcut icon" href="./favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
      <a href="./shop.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        <span>Back to Store Catalog</span>
      </a>
    </div>

    <!-- Product Detail Container -->
    <div id="product-detail-container" class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-xs">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        <div class="aspect-square skeleton rounded-2xl"></div>
        <div class="space-y-4">
          <div class="h-6 skeleton rounded w-1/3"></div>
          <div class="h-8 skeleton rounded w-3/4"></div>
          <div class="h-10 skeleton rounded w-1/2"></div>
          <div class="h-20 skeleton rounded w-full"></div>
        </div>
      </div>
    </div>

    <!-- Frequently Bought Together / Related Products -->
    <div id="related-products-section" class="hidden mt-8">
      <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xs space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-base sm:text-lg font-extrabold text-slate-900 font-display flex items-center gap-2">
              <span>🛍️ Frequently Bought Together</span>
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-[#0C831F]">Customers Also Pick</span>
            </h3>
            <p class="text-xs text-slate-500 font-medium">Popular items often ordered alongside this product</p>
          </div>
          <a href="./shop.html" class="text-xs font-extrabold text-[#0C831F] hover:underline shrink-0">Explore Store →</a>
        </div>

        <div id="related-products-slider" class="flex items-stretch gap-4 overflow-x-auto pb-2 no-scrollbar">
          <!-- Injected via JS -->
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script>
    let currentProduct = null;
    let selectedQty = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      UI.renderHeader('shop');
      UI.renderFooter();
      UI.renderMobileCartBar();

      const queryParams = Utils.getQueryParams();
      const productId = queryParams.id;

      if (!productId) {
        window.location.href = './shop.html';
        return;
      }

      const container = document.getElementById('product-detail-container');

      try {
        currentProduct = await api.get('getProductDetail', { productId });
        UI.setPageTitle(currentProduct.product_name);
        renderProduct(currentProduct);
        loadRelatedProducts(currentProduct.category_id, currentProduct.product_id);
      } catch (err) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <h3 class="text-lg font-bold text-slate-900 mb-2">Product Not Found</h3>
            <p class="text-xs text-slate-500 mb-4">${Utils.escapeHTML(err.message)}</p>
            <a href="./shop.html" class="btn-primary text-xs">Browse Products</a>
          </div>
        `;
      }
    });

    function changeQty(delta) {
      selectedQty = Math.max(1, selectedQty + delta);
      document.getElementById('product-qty-display').textContent = selectedQty;
    }

    function addCurrentToCart() {
      if (!currentProduct) return;
      Cart.addItem(currentProduct, selectedQty);
    }

    function renderRelatedCards(products) {
      const section = document.getElementById('related-products-section');
      const slider = document.getElementById('related-products-slider');
      if (!section || !slider) return;

      if (!products || products.length === 0) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      slider.innerHTML = products.map(p => {
        const hasDiscount = p.mrp > p.selling_price;
        const discountPercent = hasDiscount ? Math.round(((p.mrp - p.selling_price) / p.mrp) * 100) : 0;
        const imgUrl = p.image_url || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=300';

        return `
          <div class="w-40 sm:w-48 flex-shrink-0 bg-slate-50 hover:bg-white border border-slate-200 hover:border-emerald-300 rounded-2xl p-3 flex flex-col justify-between transition-all group shadow-xs">
            <a href="./product.html?id=${p.product_id}" class="block relative aspect-square rounded-xl overflow-hidden mb-2.5 bg-white border border-slate-100 p-1.5">
              <img src="${imgUrl}" alt="${Utils.escapeHTML(p.product_name)}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300" loading="lazy" />
              ${hasDiscount ? `
                <span class="absolute top-1.5 left-1.5 px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-[#2563EB] text-white">
                  ${discountPercent}% OFF
                </span>
              ` : ''}
            </a>

            <div class="flex-1">
              <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">${Utils.escapeHTML(p.unit || 'unit')}</div>
              <a href="./product.html?id=${p.product_id}" class="block text-xs sm:text-sm font-bold text-slate-900 hover:text-[#0C831F] transition-colors line-clamp-2 leading-snug mb-2">
                ${Utils.escapeHTML(p.product_name)}
              </a>
            </div>

            <div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-1.5 mt-auto">
              <div>
                <div class="text-sm font-extrabold text-slate-900 font-display">${Utils.formatCurrency(p.selling_price)}</div>
                ${hasDiscount ? `<div class="text-[11px] text-slate-400 line-through">${Utils.formatCurrency(p.mrp)}</div>` : ''}
              </div>
              <button onclick="Cart.addItem(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="btn-add-outline text-xs font-extrabold !py-1 !px-3 shrink-0 shadow-xs">
                ADD
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadRelatedProducts(categoryId, currentProductId) {
      // STEP 1: Render instantly (0-1ms) from local recommendation cache
      const instantProducts = (typeof Recommendations !== 'undefined')
        ? Recommendations.getInstantUpsell({
            categoryIds: categoryId ? [categoryId] : [],
            excludeProductIds: currentProductId ? [currentProductId] : [],
            limit: 6
          })
        : [];

      if (instantProducts.length > 0) {
        renderRelatedCards(instantProducts);
      }

      // STEP 2: Background refresh if cache is cold or stale
      try {
        if (typeof Recommendations !== 'undefined') {
          Recommendations.preload(false);
        }
        if (instantProducts.length === 0) {
          const res = await api.get('getUpsellProducts', {
            categoryIds: categoryId || '',
            excludeProductIds: currentProductId || '',
            limit: 6
          });
          const products = res.products || [];
          renderRelatedCards(products);
        }
      } catch (err) {
        console.warn('Related products background sync:', err);
      }
    }

    function renderProduct(p) {
      const container = document.getElementById('product-detail-container');
      const isOutOfStock = p.stock_status === 'OUT_OF_STOCK';
      const hasDiscount = p.mrp > p.selling_price;
      const discountPercent = hasDiscount ? Math.round(((p.mrp - p.selling_price) / p.mrp) * 100) : 0;
      const imgUrl = p.image_url || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=600';

      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 items-center">
          <!-- Product Image -->
          <div class="relative aspect-square rounded-2xl overflow-hidden bg-slate-50 border border-slate-200 flex items-center justify-center p-4">
            <img src="${imgUrl}" alt="${Utils.escapeHTML(p.product_name)}" class="w-full h-full object-contain ${isOutOfStock ? 'opacity-40 grayscale' : ''}" />
            
            ${hasDiscount && !isOutOfStock ? `
              <span class="absolute top-4 left-4 px-2.5 py-1 rounded-lg text-xs font-extrabold bg-[#2563EB] text-white shadow-xs">
                ${discountPercent}% OFF
              </span>
            ` : ''}

            ${isOutOfStock ? `
              <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center">
                <span class="px-4 py-2 rounded-xl text-sm font-extrabold bg-slate-900 text-white">Out of Stock</span>
              </div>
            ` : ''}
          </div>

          <!-- Product Details -->
          <div class="space-y-5">
            <div>
              <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-slate-100 border border-slate-200 text-slate-600 text-xs font-extrabold uppercase tracking-wider mb-2">
                ${Utils.escapeHTML(p.unit || 'Standard Unit')}
              </div>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 font-display leading-tight">
                ${Utils.escapeHTML(p.product_name)}
              </h1>
              ${p.sku ? `<div class="text-xs text-slate-400 font-mono mt-1">SKU: ${p.sku}</div>` : ''}
            </div>

            <!-- Price Display -->
            <div class="flex items-baseline gap-3 py-4 border-y border-slate-200">
              <div class="text-3xl font-extrabold text-slate-900 font-display">
                ${Utils.formatCurrency(p.selling_price)}
              </div>
              ${hasDiscount ? `
                <div class="text-base text-slate-400 line-through">
                  ${Utils.formatCurrency(p.mrp)}
                </div>
                <span class="text-xs font-extrabold text-[#0C831F]">Save ${Utils.formatCurrency(p.mrp - p.selling_price)}</span>
              ` : ''}
            </div>

            <!-- Rich Formatted Product Description -->
            <div class="pt-1">
              <h4 class="text-xs font-extrabold text-slate-800 uppercase tracking-wider mb-2 font-display flex items-center gap-1.5">
                <svg class="w-4 h-4 text-[#0C831F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>Product Overview & Details</span>
              </h4>
              <div class="product-rich-description bg-slate-50/70 border border-slate-200/80 rounded-2xl p-4 sm:p-5 text-slate-700">
                ${Utils.renderRichText(p.description)}
              </div>
            </div>

            <!-- Quantity Selector & Add Action -->
            <div class="space-y-3 pt-2">
              <div class="flex items-center gap-4">
                <div class="flex items-center bg-slate-50 border border-slate-300 rounded-xl p-1">
                  <button onclick="changeQty(-1)" ${isOutOfStock ? 'disabled' : ''} class="w-9 h-9 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-slate-900 font-bold flex items-center justify-center transition-colors">
                    –
                  </button>
                  <span id="product-qty-display" class="w-12 text-center font-bold text-sm text-slate-900 font-mono">1</span>
                  <button onclick="changeQty(1)" ${isOutOfStock ? 'disabled' : ''} class="w-9 h-9 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-slate-900 font-bold flex items-center justify-center transition-colors">
                    +
                  </button>
                </div>

                <button onclick="addCurrentToCart()" ${isOutOfStock ? 'disabled' : ''}
                  class="btn-primary flex-1 !py-3 text-sm font-extrabold ${isOutOfStock ? 'opacity-40 !cursor-not-allowed' : ''}">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                  <span>Add to Pickup Basket</span>
                </button>
              </div>

              <div class="text-[11px] text-slate-500 flex items-center gap-2 font-medium">
                <svg class="w-4 h-4 text-[#0C831F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                <span>Available for 10-minute store pickup today</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
