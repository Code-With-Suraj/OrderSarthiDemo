<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <link rel="apple-touch-icon" href="./icons/favicon.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="shortcut icon" href="./favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
      <a href="./shop.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        <span>Back to Store Catalog</span>
      </a>
    </div>

    <!-- Product Detail Container -->
    <div id="product-detail-container" class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-xs">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        <div class="aspect-square skeleton rounded-2xl"></div>
        <div class="space-y-4">
          <div class="h-6 skeleton rounded w-1/3"></div>
          <div class="h-8 skeleton rounded w-3/4"></div>
          <div class="h-10 skeleton rounded w-1/2"></div>
          <div class="h-20 skeleton rounded w-full"></div>
        </div>
      </div>
    </div>

    <!-- Frequently Bought Together / Related Products -->
    <div id="related-products-section" class="hidden mt-8">
      <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xs space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-base sm:text-lg font-extrabold text-slate-900 font-display flex items-center gap-2">
              <span>🛍️ Frequently Bought Together</span>
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-[#0C831F]">Customers Also Pick</span>
            </h3>
            <p class="text-xs text-slate-500 font-medium">Popular items often ordered alongside this product</p>
          </div>
          <a href="./shop.html" class="text-xs font-extrabold text-[#0C831F] hover:underline shrink-0">Explore Store →</a>
        </div>

        <div id="related-products-slider" class="flex items-stretch gap-4 overflow-x-auto pb-2 no-scrollbar">
          <!-- Injected via JS -->
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script>
    let currentProduct = null;
    let selectedQty = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      UI.renderHeader('shop');
      UI.renderFooter();
      UI.renderMobileCartBar();

      const queryParams = Utils.getQueryParams();
      const productId = queryParams.id;

      if (!productId) {
        window.location.href = './shop.html';
        return;
      }

      const container = document.getElementById('product-detail-container');

      try {
        currentProduct = await api.get('getProductDetail', { productId });
        UI.setPageTitle(currentProduct.product_name);
        renderProduct(currentProduct);
        loadRelatedProducts(currentProduct.category_id, currentProduct.product_id);
      } catch (err) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <h3 class="text-lg font-bold text-slate-900 mb-2">Product Not Found</h3>
            <p class="text-xs text-slate-500 mb-4">${Utils.escapeHTML(err.message)}</p>
            <a href="./shop.html" class="btn-primary text-xs">Browse Products</a>
          </div>
        `;
      }
    });

    function changeQty(delta) {
      selectedQty = Math.max(1, selectedQty + delta);
      document.getElementById('product-qty-display').textContent = selectedQty;
    }

    function addCurrentToCart() {
      if (!currentProduct) return;
      Cart.addItem(currentProduct, selectedQty);
    }

    function renderRelatedCards(products) {
      const section = document.getElementById('related-products-section');
      const slider = document.getElementById('related-products-slider');
      if (!section || !slider) return;

      if (!products || products.length === 0) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      slider.innerHTML = products.map(p => {
        const hasDiscount = p.mrp > p.selling_price;
        const discountPercent = hasDiscount ? Math.round(((p.mrp - p.selling_price) / p.mrp) * 100) : 0;
        const imgUrl = Utils.formatImageUrl(p.image_url, 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=300');

        return `
          <div class="w-40 sm:w-48 flex-shrink-0 bg-slate-50 hover:bg-white border border-slate-200 hover:border-emerald-300 rounded-2xl p-3 flex flex-col justify-between transition-all group shadow-xs">
            <a href="./product.html?id=${p.product_id}" class="block relative aspect-square rounded-xl overflow-hidden mb-2.5 bg-white border border-slate-100 p-1.5">
              <img src="${imgUrl}" alt="${Utils.escapeHTML(p.product_name)}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=300'" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300" loading="lazy" />
              ${hasDiscount ? `
                <span class="absolute top-1.5 left-1.5 px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-[#2563EB] text-white">
                  ${discountPercent}% OFF
                </span>
              ` : ''}
            </a>

            <div class="flex-1">
              <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">${Utils.escapeHTML(p.unit || 'unit')}</div>
              <a href="./product.html?id=${p.product_id}" class="block text-xs sm:text-sm font-bold text-slate-900 hover:text-[#0C831F] transition-colors line-clamp-2 leading-snug mb-2">
                ${Utils.escapeHTML(p.product_name)}
              </a>
            </div>

            <div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-1.5 mt-auto">
              <div>
                <div class="text-sm font-extrabold text-slate-900 font-display">${Utils.formatCurrency(p.selling_price)}</div>
                ${hasDiscount ? `<div class="text-[11px] text-slate-400 line-through">${Utils.formatCurrency(p.mrp)}</div>` : ''}
              </div>
              <button onclick="Cart.addItem(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="btn-add-outline text-xs font-extrabold !py-1 !px-3 shrink-0 shadow-xs">
                ADD
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadRelatedProducts(categoryId, currentProductId) {
      // STEP 1: Render instantly (0-1ms) from local recommendation cache
      const instantProducts = (typeof Recommendations !== 'undefined')
        ? Recommendations.getInstantUpsell({
            categoryIds: categoryId ? [categoryId] : [],
            excludeProductIds: currentProductId ? [currentProductId] : [],
            limit: 6
          })
        : [];

      if (instantProducts.length > 0) {
        renderRelatedCards(instantProducts);
      }

      // STEP 2: Background refresh if cache is cold or stale
      try {
        if (typeof Recommendations !== 'undefined') {
          Recommendations.preload(false);
        }
        if (instantProducts.length === 0) {
          const res = await api.get('getUpsellProducts', {
            categoryIds: categoryId || '',
            excludeProductIds: currentProductId || '',
            limit: 6
          });
          const products = res.products || [];
          renderRelatedCards(products);
        }
      } catch (err) {
        console.warn('Related products background sync:', err);
      }
    }

    function renderProduct(p) {
      const container = document.getElementById('product-detail-container');
      const isOutOfStock = p.stock_status === 'OUT_OF_STOCK';
      const hasDiscount = p.mrp > p.selling_price;
      const discountPercent = hasDiscount ? Math.round(((p.mrp - p.selling_price) / p.mrp) * 100) : 0;

      // Parse and format all images (from p.images array or p.image_url string)
      let productImages = [];
      if (Array.isArray(p.images) && p.images.length > 0) {
        productImages = p.images.filter(Boolean);
      } else if (p.image_url) {
        productImages = String(p.image_url).split(/[\n,\r|]+/).map(s => s.trim()).filter(Boolean);
      }
      productImages = productImages.map(img => Utils.formatImageUrl(img));
      if (productImages.length === 0) {
        productImages = ['https://images.unsplash.com/photo-1542838132-92c53300491e?w=600'];
      }
      window.currentProductImages = productImages;
      window.activeImageIndex = 0;

      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 items-start">
          <!-- Product Multi-Image Gallery (Blinkit / E-Commerce Pro Style) -->
          <div class="space-y-3.5 sticky top-24">
            <!-- Main Hero Image Display -->
            <div class="relative aspect-square rounded-3xl overflow-hidden bg-slate-50 border border-slate-200 flex items-center justify-center p-4 group shadow-xs">
              <img id="main-product-image" src="${productImages[0]}" alt="${Utils.escapeHTML(p.product_name)}"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=600'"
                class="w-full h-full object-contain transition-all duration-300 ${isOutOfStock ? 'opacity-40 grayscale' : ''}" />
              
              <!-- Discount Badge -->
              ${hasDiscount && !isOutOfStock ? `
                <span class="absolute top-4 left-4 px-2.5 py-1 rounded-xl text-xs font-extrabold bg-[#2563EB] text-white shadow-xs">
                  ${discountPercent}% OFF
                </span>
              ` : ''}

              <!-- Image Index Counter (e.g. 1 / 4) -->
              ${productImages.length > 1 ? `
                <span id="gallery-counter-badge" class="absolute bottom-4 right-4 px-2.5 py-1 rounded-xl text-[11px] font-extrabold bg-slate-900/80 text-white backdrop-blur-xs shadow-xs">
                  1 / ${productImages.length}
                </span>
              ` : ''}

              <!-- Prev / Next Navigation Overlay Arrows -->
              ${productImages.length > 1 ? `
                <button type="button" onclick="prevProductImage()" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 hover:bg-white text-slate-800 flex items-center justify-center shadow-md border border-slate-200 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-all hover:scale-105 cursor-pointer" title="Previous image">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <button type="button" onclick="nextProductImage()" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 hover:bg-white text-slate-800 flex items-center justify-center shadow-md border border-slate-200 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-all hover:scale-105 cursor-pointer" title="Next image">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>
              ` : ''}

              <!-- Out of stock badge -->
              ${isOutOfStock ? `
                <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center">
                  <span class="px-4 py-2 rounded-xl text-sm font-extrabold bg-slate-900 text-white">Out of Stock</span>
                </div>
              ` : ''}
            </div>

            <!-- Thumbnail Navigation Strip (if multiple images) -->
            ${productImages.length > 1 ? `
              <div class="flex items-center gap-2.5 overflow-x-auto pb-1 no-scrollbar pt-1">
                ${productImages.map((img, idx) => `
                  <button type="button" onclick="switchProductImage(${idx})"
                    class="gallery-thumbnail-btn relative w-16 h-16 sm:w-20 sm:h-20 rounded-2xl overflow-hidden border-2 p-1 bg-white cursor-pointer shrink-0 transition-all duration-200 ${idx === 0 ? 'border-[#0C831F] ring-2 ring-[#0C831F]/30 scale-105 shadow-sm' : 'border-slate-200 hover:border-slate-400 opacity-75 hover:opacity-100'}">
                    <img src="${img}" alt="${Utils.escapeHTML(p.product_name)} - View ${idx + 1}"
                      onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=200'"
                      class="w-full h-full object-contain" />
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <!-- Product Details -->
          <div class="space-y-5">
            <div>
              <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-slate-100 border border-slate-200 text-slate-600 text-xs font-extrabold uppercase tracking-wider mb-2">
                ${Utils.escapeHTML(p.unit || 'Standard Unit')}
              </div>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 font-display leading-tight">
                ${Utils.escapeHTML(p.product_name)}
              </h1>
              ${p.sku ? `<div class="text-xs text-slate-400 font-mono mt-1">SKU: ${p.sku}</div>` : ''}
            </div>

            <!-- Price Display -->
            <div class="flex items-baseline gap-3 py-4 border-y border-slate-200">
              <div class="text-3xl font-extrabold text-slate-900 font-display">
                ${Utils.formatCurrency(p.selling_price)}
              </div>
              ${hasDiscount ? `
                <div class="text-base text-slate-400 line-through">
                  ${Utils.formatCurrency(p.mrp)}
                </div>
                <span class="text-xs font-extrabold text-[#0C831F]">Save ${Utils.formatCurrency(p.mrp - p.selling_price)}</span>
              ` : ''}
            </div>

            <!-- Collapsible / Toggleable Product Overview & Details -->
            <div class="border border-slate-200 rounded-2xl bg-white overflow-hidden shadow-2xs">
              <button type="button" onclick="toggleProductOverview()" class="w-full p-3.5 sm:p-4 flex items-center justify-between gap-3 text-left bg-slate-50/90 hover:bg-slate-100/90 transition-all cursor-pointer group">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="w-7 h-7 rounded-xl bg-emerald-100 text-[#0C831F] flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                  </span>
                  <div class="min-w-0">
                    <h4 class="text-xs sm:text-sm font-extrabold text-slate-900 font-display flex items-center gap-2">
                      <span>Product Overview & Details</span>
                      <span class="text-[9px] font-bold px-1.5 py-0.2 rounded bg-slate-200/80 text-slate-600">Info</span>
                    </h4>
                    <p class="text-[10px] text-slate-500 font-medium truncate">Click to expand/collapse full specifications & details</p>
                  </div>
                </div>

                <div class="flex items-center gap-1.5 shrink-0">
                  <span id="overview-toggle-label" class="text-[10px] font-extrabold text-[#0C831F] uppercase tracking-wider">Hide</span>
                  <div class="w-6 h-6 rounded-lg bg-white border border-slate-200 flex items-center justify-center shadow-2xs group-hover:border-slate-300">
                    <svg id="overview-toggle-arrow" class="w-3.5 h-3.5 text-slate-600 transform transition-transform duration-300 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                    </svg>
                  </div>
                </div>
              </button>

              <div id="product-overview-content" class="p-4 sm:p-5 border-t border-slate-100 bg-white transition-all duration-300">
                <div class="product-rich-description">
                  ${Utils.renderRichText(p.description)}
                </div>
              </div>
            </div>

            <!-- Quantity Selector & Add Action -->
            <div class="space-y-3 pt-2">
              <div class="flex items-center gap-4">
                <div class="flex items-center bg-slate-50 border border-slate-300 rounded-xl p-1">
                  <button onclick="changeQty(-1)" ${isOutOfStock ? 'disabled' : ''} class="w-9 h-9 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-slate-900 font-bold flex items-center justify-center transition-colors">
                    –
                  </button>
                  <span id="product-qty-display" class="w-12 text-center font-bold text-sm text-slate-900 font-mono">1</span>
                  <button onclick="changeQty(1)" ${isOutOfStock ? 'disabled' : ''} class="w-9 h-9 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-slate-900 font-bold flex items-center justify-center transition-colors">
                    +
                  </button>
                </div>

                <button onclick="addCurrentToCart()" ${isOutOfStock ? 'disabled' : ''}
                  class="btn-primary flex-1 !py-3 text-sm font-extrabold ${isOutOfStock ? 'opacity-40 !cursor-not-allowed' : ''}">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                  <span>Add to Pickup Basket</span>
                </button>
              </div>

              <div class="text-[11px] text-slate-500 flex items-center gap-2 font-medium">
                <svg class="w-4 h-4 text-[#0C831F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                <span>Available for 10-minute store pickup today</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleProductOverview() {
      const content = document.getElementById('product-overview-content');
      const arrow = document.getElementById('overview-toggle-arrow');
      const label = document.getElementById('overview-toggle-label');
      if (!content || !arrow) return;

      const isHidden = content.classList.contains('hidden');
      if (isHidden) {
        content.classList.remove('hidden');
        arrow.classList.add('rotate-180');
        if (label) {
          label.textContent = 'Hide';
          label.className = 'text-[10px] font-extrabold text-[#0C831F] uppercase tracking-wider';
        }
      } else {
        content.classList.add('hidden');
        arrow.classList.remove('rotate-180');
        if (label) {
          label.textContent = 'View';
          label.className = 'text-[10px] font-extrabold text-slate-500 uppercase tracking-wider';
        }
      }
    }

    function switchProductImage(index) {
      if (!window.currentProductImages || !window.currentProductImages[index]) return;
      window.activeImageIndex = index;
      const mainImg = document.getElementById('main-product-image');
      const counter = document.getElementById('gallery-counter-badge');
      if (mainImg) {
        mainImg.style.opacity = '0.3';
        mainImg.src = Utils.formatImageUrl(window.currentProductImages[index]);
        setTimeout(() => { mainImg.style.opacity = '1'; }, 100);
      }
      if (counter) {
        counter.textContent = `${index + 1} / ${window.currentProductImages.length}`;
      }

      // Update thumbnail active states
      const thumbBtns = document.querySelectorAll('.gallery-thumbnail-btn');
      thumbBtns.forEach((btn, i) => {
        if (i === index) {
          btn.className = 'gallery-thumbnail-btn relative w-16 h-16 sm:w-20 sm:h-20 rounded-2xl overflow-hidden border-2 p-1 bg-white cursor-pointer shrink-0 transition-all duration-200 border-[#0C831F] ring-2 ring-[#0C831F]/30 scale-105 shadow-sm';
        } else {
          btn.className = 'gallery-thumbnail-btn relative w-16 h-16 sm:w-20 sm:h-20 rounded-2xl overflow-hidden border-2 p-1 bg-white cursor-pointer shrink-0 transition-all duration-200 border-slate-200 hover:border-slate-400 opacity-75 hover:opacity-100';
        }
      });
    }

    function nextProductImage() {
      if (!window.currentProductImages || window.currentProductImages.length <= 1) return;
      const nextIdx = (window.activeImageIndex + 1) % window.currentProductImages.length;
      switchProductImage(nextIdx);
    }

    function prevProductImage() {
      if (!window.currentProductImages || window.currentProductImages.length <= 1) return;
      const prevIdx = (window.activeImageIndex - 1 + window.currentProductImages.length) % window.currentProductImages.length;
      switchProductImage(prevIdx);
    }

    // Keyboard Left/Right Navigation Support
    document.addEventListener('keydown', (e) => {
      if (window.currentProductImages && window.currentProductImages.length > 1) {
        if (e.key === 'ArrowRight') nextProductImage();
        if (e.key === 'ArrowLeft') prevProductImage();
      }
    });
  </script>
</body>
</html>
