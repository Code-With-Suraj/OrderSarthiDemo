<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <link rel="apple-touch-icon" href="./icons/favicon.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="shortcut icon" href="./favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6 flex items-center justify-between">
      <a href="./orders.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        <span>All My Orders</span>
      </a>
      <div class="text-[11px] text-[#0C831F] flex items-center gap-1.5 font-extrabold">
        <span class="w-2 h-2 rounded-full bg-[#0C831F] animate-pulse"></span>
        <span>Auto-updating live</span>
      </div>
    </div>

    <!-- Live Tracking Dynamic Container -->
    <div id="tracking-content">
      <div class="bg-white border border-slate-200 rounded-3xl p-8 space-y-6 shadow-xs">
        <div class="h-8 skeleton rounded w-1/3"></div>
        <div class="h-20 skeleton rounded w-full"></div>
        <div class="space-y-4 pt-4">
          <div class="h-10 skeleton rounded w-full"></div>
          <div class="h-10 skeleton rounded w-full"></div>
          <div class="h-10 skeleton rounded w-full"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/orders.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OrdersController.initTrackPage();
    });
  </script>
</body>
</html>
