<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickup Slots — Admin OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="admin-nav"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 font-display">Pickup Slots Management</h1>
        <p class="text-xs sm:text-sm text-slate-500 font-medium">View real-time booking occupancy and store capacity per time slot</p>
      </div>

      <div class="flex items-center gap-3">
        <label class="text-xs font-bold text-slate-700">Select Date:</label>
        <input type="date" id="slot-date-picker"
          class="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-xs text-slate-900 font-bold focus:outline-none focus:border-[#0C831F] shadow-xs" />
      </div>
    </div>

    <!-- Slots Grid -->
    <div id="admin-slots-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Injected via JavaScript -->
    </div>

  </main>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin/slots.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AdminSlots.init();
    });
  </script>
</body>
</html>
