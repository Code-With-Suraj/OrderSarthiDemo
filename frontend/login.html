<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 max-w-md w-full shadow-xs space-y-6">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-extrabold text-slate-900 font-display">Customer Login</h1>
        <p class="text-xs text-slate-500 font-medium">Access your past 10-minute store pickup orders</p>
      </div>

      <div id="checkout-notice" class="hidden p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 flex items-center gap-2.5 shadow-xs font-medium">
        <span class="text-base">🛍️</span>
        <span>Please <strong>Login</strong> or <strong>Create Account</strong> to schedule your store pickup order.</span>
      </div>

      <form id="customer-login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Registered Mobile Number</label>
          <input type="tel" id="login-mobile" required placeholder="10-digit mobile number" maxlength="10"
            class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] focus:ring-2 focus:ring-[#0C831F]/20 font-mono font-medium" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••"
            class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#0C831F] focus:ring-2 focus:ring-[#0C831F]/20 font-medium" />
        </div>

        <button type="submit" id="login-submit-btn" class="btn-primary w-full text-sm font-extrabold !py-3">
          <span>Login to Account</span>
        </button>
      </form>

      <div class="text-center pt-2 border-t border-slate-200 text-xs text-slate-500 font-medium">
        Don't have an account yet? 
        <a id="register-link" href="./register.html" class="text-[#0C831F] hover:underline font-extrabold ml-1">Create Account</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderHeader('login');
      UI.renderFooter();
      UI.setPageTitle('Customer Login');

      const queryParams = Utils.getQueryParams();
      if (queryParams.redirect) {
        document.getElementById('checkout-notice')?.classList.remove('hidden');
        const regLink = document.getElementById('register-link');
        if (regLink) regLink.href = `./register.html?redirect=${encodeURIComponent(queryParams.redirect)}`;
      }

      const form = document.getElementById('customer-login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-submit-btn');
        btn.disabled = true;
        btn.textContent = 'Logging in...';

        const mobile = document.getElementById('login-mobile').value;
        const password = document.getElementById('login-password').value;

        try {
          await Auth.loginCustomer(mobile, password);
          Utils.showToast('Login successful!', 'success');

          const redirect = queryParams.redirect ? decodeURIComponent(queryParams.redirect) : './orders.html';
          setTimeout(() => window.location.href = redirect, 500);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Login to Account';
          Utils.showToast(err.message || 'Login failed', 'error');
        }
      });
    });
  </script>
</body>
</html>
