<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Pickup Basket — OrderSarthi</title>
  
  <meta name="theme-color" content="#F8CB46">
  <link rel="apple-touch-icon" href="./icons/favicon.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="shortcut icon" href="./favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F4F6FB] text-slate-900 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 font-display">Your Pickup Basket</h1>
        <p class="text-xs sm:text-sm text-slate-500 font-medium">Review your items before selecting a pickup slot</p>
      </div>
      <button onclick="clearAll()" id="clear-cart-btn" class="text-xs text-rose-600 hover:text-rose-700 font-bold hidden">
        Clear All
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <!-- Cart Items List -->
      <div class="lg:col-span-8 space-y-3.5">
        <!-- Minimum Order Value Progress Card -->
        <div id="cart-mov-progress-card" class="hidden"></div>

        <div id="cart-items-container" class="space-y-3.5">
          <!-- Injected via JavaScript -->
        </div>
      </div>

      <!-- Cart Summary Card -->
      <div class="lg:col-span-4">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-5 sticky top-24 shadow-xs">
          <h3 class="text-base font-extrabold text-slate-900 font-display border-b border-slate-200 pb-3">Bill Details</h3>
          
          <div class="space-y-2.5 text-xs font-medium">
            <div class="flex items-center justify-between text-slate-700">
              <span>Items Subtotal:</span>
              <span id="summary-subtotal" class="font-extrabold text-slate-900 font-display text-sm">₹0</span>
            </div>
            <div class="flex items-center justify-between text-slate-600">
              <span>Store Pickup Fee:</span>
              <span class="text-[#0C831F] font-extrabold">FREE</span>
            </div>
            <div class="flex items-center justify-between text-slate-600">
              <span>Packaging Charge:</span>
              <span class="text-[#0C831F] font-extrabold">FREE</span>
            </div>
            <div id="summary-mov-status" class="pt-1"></div>
          </div>

          <div class="pt-3 border-t border-slate-200 flex items-center justify-between">
            <span class="font-extrabold text-slate-900 text-sm">To Pay:</span>
            <span id="summary-total" class="text-xl font-extrabold text-[#0C831F] font-display">₹0</span>
          </div>

          <div class="space-y-2 pt-2">
            <a href="./checkout.html" id="proceed-checkout-btn" class="btn-primary w-full text-sm font-extrabold !py-3">
              <span id="proceed-btn-text">Proceed to Pickup Slot</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </a>
            <a href="./shop.html" class="btn-secondary w-full text-xs !py-2.5 font-bold">
              <span>Add More Items</span>
            </a>
          </div>

          <p class="text-[11px] text-slate-500 text-center font-medium">
            ⚡ 10-Minute store pickup slot confirmed at next step.
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderHeader('cart');
      UI.renderFooter();
      UI.setPageTitle('Pickup Basket');
      renderCart();

      window.addEventListener('cart:updated', () => {
        renderCart();
      });
    });

    function renderCart() {
      const container = document.getElementById('cart-items-container');
      const movCard = document.getElementById('cart-mov-progress-card');
      const summaryMovStatus = document.getElementById('summary-mov-status');
      const clearBtn = document.getElementById('clear-cart-btn');
      const proceedBtn = document.getElementById('proceed-checkout-btn');
      const proceedBtnText = document.getElementById('proceed-btn-text');
      const subtotalDisplay = document.getElementById('summary-subtotal');
      const totalDisplay = document.getElementById('summary-total');

      const items = Cart.getItems();
      const subtotal = Cart.getSubtotal();
      const movStatus = Cart.getMinOrderStatus();

      subtotalDisplay.textContent = Utils.formatCurrency(subtotal);
      totalDisplay.textContent = Utils.formatCurrency(subtotal);

      if (items.length === 0) {
        clearBtn?.classList.add('hidden');
        if (movCard) movCard.classList.add('hidden');
        if (summaryMovStatus) summaryMovStatus.innerHTML = '';
        if (proceedBtn) {
          proceedBtn.classList.add('opacity-40', 'pointer-events-none');
          proceedBtn.onclick = null;
        }

        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-3xl p-12 text-center shadow-xs">
            <div class="w-16 h-16 rounded-2xl bg-slate-100 flex items-center justify-center mx-auto mb-4 text-slate-400">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            </div>
            <h3 class="text-lg font-extrabold text-slate-900 font-display mb-1">Your Basket is Empty</h3>
            <p class="text-xs text-slate-500 mb-6">Looks like you haven't added any items to your pickup basket yet.</p>
            <a href="./shop.html" class="btn-primary text-xs font-extrabold">Explore Store Products</a>
          </div>
        `;
        return;
      }

      clearBtn?.classList.remove('hidden');

      // Render Minimum Order Value Progress Card
      if (movStatus.minOrder > 0) {
        if (!movStatus.isMet) {
          if (movCard) {
            movCard.classList.remove('hidden');
            movCard.innerHTML = `
              <div class="p-4 sm:p-5 rounded-3xl bg-gradient-to-r from-amber-500/10 via-amber-50 to-orange-50/70 border border-amber-300 shadow-xs space-y-3">
                <div class="flex items-center justify-between gap-3">
                  <div class="flex items-center gap-2.5">
                    <span class="w-7 h-7 rounded-xl bg-amber-500 text-white font-extrabold text-xs flex items-center justify-center shadow-xs">⚡</span>
                    <div>
                      <h4 class="font-extrabold text-amber-950 text-xs sm:text-sm">
                        Add <span class="text-[#0C831F] font-black">${Utils.formatCurrency(movStatus.deficit)}</span> more to place order
                      </h4>
                      <p class="text-[11px] text-amber-800 font-medium">Minimum online order amount is <strong>${Utils.formatCurrency(movStatus.minOrder)}</strong></p>
                    </div>
                  </div>
                  <a href="./shop.html" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs transition-colors shadow-xs shrink-0">
                    + Add Items
                  </a>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-amber-200/80 rounded-full h-2.5 overflow-hidden p-0.5">
                  <div class="bg-gradient-to-r from-amber-500 to-[#0C831F] h-full rounded-full transition-all duration-500 ease-out" style="width: ${movStatus.percentage}%"></div>
                </div>
                <div class="flex items-center justify-between text-[10px] font-bold text-amber-800">
                  <span>${Utils.formatCurrency(subtotal)} in cart</span>
                  <span>Goal: ${Utils.formatCurrency(movStatus.minOrder)} (${movStatus.percentage}%)</span>
                </div>
              </div>
            `;
          }

          if (summaryMovStatus) {
            summaryMovStatus.innerHTML = `
              <div class="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-[11px] flex items-center justify-between">
                <span class="font-bold">Min. Order Requirement:</span>
                <span class="font-extrabold text-rose-600">${Utils.formatCurrency(movStatus.minOrder)}</span>
              </div>
            `;
          }

          if (proceedBtn) {
            proceedBtn.classList.remove('pointer-events-none');
            proceedBtn.classList.add('opacity-75', 'bg-amber-600', 'hover:bg-amber-700');
            if (proceedBtnText) proceedBtnText.textContent = `Add ${Utils.formatCurrency(movStatus.deficit)} More to Order`;
            proceedBtn.onclick = (e) => {
              e.preventDefault();
              Utils.showToast(`Please add items worth ${Utils.formatCurrency(movStatus.deficit)} more to reach minimum order value (${Utils.formatCurrency(movStatus.minOrder)}).`, 'warning');
            };
          }
        } else {
          // Minimum requirement met
          if (movCard) {
            movCard.classList.remove('hidden');
            movCard.innerHTML = `
              <div class="p-3.5 sm:p-4 rounded-3xl bg-emerald-50 border border-emerald-300 shadow-xs flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5">
                  <span class="w-7 h-7 rounded-xl bg-[#0C831F] text-white font-extrabold text-xs flex items-center justify-center shadow-xs">✓</span>
                  <div>
                    <h4 class="font-extrabold text-[#0C831F] text-xs sm:text-sm">
                      🎉 Minimum order requirement met!
                    </h4>
                    <p class="text-[11px] text-emerald-800 font-medium">Order total (${Utils.formatCurrency(subtotal)}) satisfies shop minimum (${Utils.formatCurrency(movStatus.minOrder)}).</p>
                  </div>
                </div>
                <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-[#0C831F] text-white shadow-xs shrink-0">
                  Ready to Slot
                </span>
              </div>
            `;
          }

          if (summaryMovStatus) {
            summaryMovStatus.innerHTML = `
              <div class="p-2 rounded-xl bg-emerald-50 border border-emerald-200 text-[#0C831F] text-[11px] flex items-center justify-between font-bold">
                <span>Min. Order (₹${movStatus.minOrder}):</span>
                <span class="text-xs font-black">✓ UNLOCKED</span>
              </div>
            `;
          }

          if (proceedBtn) {
            proceedBtn.classList.remove('opacity-75', 'opacity-40', 'pointer-events-none', 'bg-amber-600', 'hover:bg-amber-700');
            proceedBtn.classList.add('bg-[#0C831F]', 'hover:bg-[#096818]');
            if (proceedBtnText) proceedBtnText.textContent = 'Proceed to Pickup Slot';
            proceedBtn.onclick = null;
          }
        }
      } else {
        if (movCard) movCard.classList.add('hidden');
        if (summaryMovStatus) summaryMovStatus.innerHTML = '';
        if (proceedBtn) {
          proceedBtn.classList.remove('opacity-40', 'pointer-events-none', 'opacity-75', 'bg-amber-600');
          proceedBtn.classList.add('bg-[#0C831F]', 'hover:bg-[#096818]');
          if (proceedBtnText) proceedBtnText.textContent = 'Proceed to Pickup Slot';
          proceedBtn.onclick = null;
        }
      }

      container.innerHTML = items.map(item => `
        <div class="bg-white border border-slate-200 rounded-2xl p-3.5 sm:p-4 flex items-center justify-between gap-4 shadow-xs">
          <div class="flex items-center gap-3.5 flex-1 min-w-0">
            <img src="${item.image_url || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=100'}" class="w-14 h-14 rounded-xl object-contain bg-slate-50 border border-slate-100 p-1 shrink-0" />
            <div class="min-w-0">
              <h4 class="font-extrabold text-xs sm:text-sm text-slate-900 truncate">${Utils.escapeHTML(item.product_name)}</h4>
              <div class="text-[11px] text-slate-500 font-medium">${item.unit} • ${Utils.formatCurrency(item.selling_price)} each</div>
              <div class="text-xs font-extrabold text-[#0C831F] font-display mt-0.5">${Utils.formatCurrency(item.selling_price * item.quantity)}</div>
            </div>
          </div>

          <!-- Quantity Stepper -->
          <div class="flex items-center gap-3 shrink-0">
            <div class="flex items-center bg-emerald-50 border border-emerald-200 rounded-lg p-0.5">
              <button onclick="Cart.updateQuantity('${item.product_id}', ${item.quantity - 1})" class="w-7 h-7 rounded bg-white hover:bg-emerald-100 text-[#0C831F] font-extrabold flex items-center justify-center text-xs shadow-xs">
                –
              </button>
              <span class="w-8 text-center font-extrabold text-xs text-[#0C831F] font-mono">${item.quantity}</span>
              <button onclick="Cart.updateQuantity('${item.product_id}', ${item.quantity + 1})" class="w-7 h-7 rounded bg-white hover:bg-emerald-100 text-[#0C831F] font-extrabold flex items-center justify-center text-xs shadow-xs">
                +
              </button>
            </div>

            <button onclick="Cart.removeItem('${item.product_id}')" class="text-slate-400 hover:text-rose-600 p-1.5 transition-colors" title="Remove item">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function clearAll() {
      if (confirm('Are you sure you want to clear your cart?')) {
        Cart.clear();
      }
    }
  </script>
</body>
</html>
