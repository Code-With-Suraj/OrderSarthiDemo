<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/svg+xml" href="/frontend/icons/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta http-equiv="refresh" content="0; url=/frontend/index.html">
  <script>
    const path = window.location.pathname;
    if (path === '/' || path === '/index.html' || path === '') {
      window.location.replace('/frontend/index.html');

</head>
<body>
  <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f8fafc; color: #0f172a;">
